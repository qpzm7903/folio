name: folio
description: "小金库 · 一句话停一停 — 用来再次遇见你自己摘下的金句。"
publish_to: "none"

# 版本号: MAJOR.MINOR.PATCH+BUILD
version: 0.19.3+61

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  flutter_riverpod: ^2.5.1
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  flutter_svg: ^2.0.10+1
  talker: ^4.4.1
  talker_flutter: ^4.4.1
  intl: ">=0.19.0 <1.0.0"
  file_selector: ^1.0.3
  go_router: ^14.6.2
  home_widget: ^0.7.0
  # v0.15.0 重新引入: v0.14.1 用 adb 抓栈定位 Issue #5 真因是 home_widget
  # 拉进来的 androidx.work WorkManagerInitializer 在 Android 16 上 init 失败,
  # 跟 drift / sqlite3 无关。v0.13.4 切除是误诊误修, 这里恢复以满足 L12。
  drift: ^2.20.0
  sqlite3_flutter_libs: ^0.5.24
  # L20: ohos 上指 sqlite3 加载器到系统 libsqlite3.so (lib/data/ohos_sqlite.dart);
  # 本来就是 drift 的传递依赖, 直接 import 需要声明为直接依赖。
  sqlite3: ^2.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  fake_async: ^1.3.1
  drift_dev: ^2.20.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
  generate: true

  fonts:
    - family: NotoSerifSC
      fonts:
        - asset: assets/fonts/NotoSerifSC-Regular.ttf
        - asset: assets/fonts/NotoSerifSC-Medium.ttf
          weight: 500
        - asset: assets/fonts/NotoSerifSC-SemiBold.ttf
          weight: 600
    - family: EBGaramond
      fonts:
        - asset: assets/fonts/EBGaramond-Regular.ttf
        - asset: assets/fonts/EBGaramond-Italic.ttf
          style: italic
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
        - asset: assets/fonts/NotoSansSC-Medium.ttf
          weight: 500

  assets:
    - assets/icons/
    - assets/paper-grain.svg
