name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/flutter-setup
        with:
          platforms: android,web

      - name: Format (apply only)
        # CI 上 Dart 版本可能跟开发者本地不一致, 强制门控会死循环;
        # 风格由开发者本地 dart format 保证, CI 这里只 apply。
        run: dart format lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --reporter expanded

  build-android:
    name: build android apk
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: ./.github/actions/flutter-setup
        with:
          platforms: android,web

      - name: Inject Android widget native files (L07)
        run: bash tool/inject_android_widget.sh

      - name: Resolve app version
        id: ver
        run: |
          v=$(awk -F'[ :+]' '/^version:/{print $2; exit}' pubspec.yaml)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK with version
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            dist/folio-${{ steps.ver.outputs.version }}-android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: folio-android-apk
          path: dist/folio-${{ steps.ver.outputs.version }}-android.apk
          if-no-files-found: error

  build-web:
    name: build web bundle
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/flutter-setup
        with:
          platforms: android,web

      - name: Resolve app version
        id: ver
        run: |
          v=$(awk -F'[ :+]' '/^version:/{print $2; exit}' pubspec.yaml)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build web (release)
        run: flutter build web --release --base-href "/folio/"

      - name: Zip web bundle
        run: |
          cd build/web && zip -r ../../folio-${{ steps.ver.outputs.version }}-web.zip . && cd ../..

      - name: Upload web bundle
        uses: actions/upload-artifact@v4
        with:
          name: folio-web
          path: folio-${{ steps.ver.outputs.version }}-web.zip
          if-no-files-found: error

  build-linux:
    name: build linux desktop
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux desktop toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev

      - uses: ./.github/actions/flutter-setup
        with:
          platforms: linux

      - name: Resolve app version
        id: ver
        run: |
          v=$(awk -F'[ :+]' '/^version:/{print $2; exit}' pubspec.yaml)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Enable Linux desktop
        run: flutter config --enable-linux-desktop

      - name: Build Linux (release)
        run: flutter build linux --release

      - name: Tar Linux bundle
        run: |
          cd build/linux/x64/release/bundle && \
          tar -czf ../../../../../folio-${{ steps.ver.outputs.version }}-linux-x64.tar.gz . && \
          cd ../../../../..

      - name: Upload Linux bundle
        uses: actions/upload-artifact@v4
        with:
          name: folio-linux-x64
          path: folio-${{ steps.ver.outputs.version }}-linux-x64.tar.gz
          if-no-files-found: error

  build-windows:
    name: build windows desktop
    needs: test
    runs-on: windows-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/flutter-setup
        with:
          platforms: windows

      - name: Resolve app version
        id: ver
        shell: bash
        run: |
          v=$(awk -F'[ :+]' '/^version:/{print $2; exit}' pubspec.yaml)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Build Windows (release)
        run: flutter build windows --release

      - name: Zip Windows bundle
        shell: pwsh
        run: |
          Compress-Archive -Path build/windows/x64/runner/Release/* `
            -DestinationPath folio-${{ steps.ver.outputs.version }}-windows-x64.zip

      - name: Upload Windows bundle
        uses: actions/upload-artifact@v4
        with:
          name: folio-windows-x64
          path: folio-${{ steps.ver.outputs.version }}-windows-x64.zip
          if-no-files-found: error

  build-macos:
    name: build macos desktop
    needs: test
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/flutter-setup
        with:
          platforms: macos

      - name: Resolve app version
        id: ver
        run: |
          v=$(awk -F'[ :+]' '/^version:/{print $2; exit}' pubspec.yaml)
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Enable macOS desktop
        run: flutter config --enable-macos-desktop

      - name: Build macOS (release, unsigned)
        # 不签名: GitHub Actions 上没有开发者证书; 用户首次打开需 ctrl+click 通过。
        # 上架 Mac App Store 是 L08 后续工作。
        run: flutter build macos --release

      - name: Zip macOS .app
        run: |
          cd build/macos/Build/Products/Release && \
          zip -r ../../../../../folio-${{ steps.ver.outputs.version }}-macos.zip folio.app && \
          cd ../../../../..

      - name: Upload macOS bundle
        uses: actions/upload-artifact@v4
        with:
          name: folio-macos
          path: folio-${{ steps.ver.outputs.version }}-macos.zip
          if-no-files-found: error

  release:
    name: github release (tag only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android, build-web, build-linux, build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      # 故意不 `actions/checkout` —— release job 只需要 artifacts + 上传, 不需要
      # git working tree。之前 checkout@v4 在 tag-only context 里偶发 token 注入
      # 失败 ("could not read Username for 'https://github.com'"), 直接绕开。
      - uses: actions/download-artifact@v4
        with:
          name: folio-android-apk
          path: dist/android

      - uses: actions/download-artifact@v4
        with:
          name: folio-web
          path: dist/web

      - uses: actions/download-artifact@v4
        with:
          name: folio-linux-x64
          path: dist/linux

      - uses: actions/download-artifact@v4
        with:
          name: folio-windows-x64
          path: dist/windows

      - uses: actions/download-artifact@v4
        with:
          name: folio-macos
          path: dist/macos

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/android/*.apk
            dist/web/*.zip
            dist/linux/*.tar.gz
            dist/windows/*.zip
            dist/macos/*.zip
