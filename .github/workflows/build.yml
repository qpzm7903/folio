name: build

# v0.15.2 起根据 Issue #10 "版本可以先只发 apk 的，待彻底稳定后再出其他的",
# 暂时只发 Android APK; build-web / build-linux / build-windows / build-macos
# 4 个 job 已下线 (git history 保留, 未来恢复 git show v0.15.1:.github/workflows/build.yml)。
# L17 (多平台 CI 产物) 长期规划状态保持 [x] —— 工程能力仍在, 只是短期不发布。

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    name: analyze + test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/flutter-setup
        with:
          platforms: android,web

      - name: Format (apply only)
        # CI 上 Dart 版本可能跟开发者本地不一致, 强制门控会死循环;
        # 风格由开发者本地 dart format 保证, CI 这里只 apply。
        run: dart format lib test

      - name: Analyze
        run: flutter analyze --no-fatal-infos

      - name: Test
        run: flutter test --reporter expanded

  build-android:
    name: build android apk
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: ./.github/actions/flutter-setup
        with:
          platforms: android,web

      - name: Inject Android widget native files (L07)
        run: bash tool/inject_android_widget.sh

      - name: Resolve app version
        id: ver
        run: |
          v=$(grep '^version:' pubspec.yaml | sed -E 's/^version:[[:space:]]*//; s/[+].*$//')
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build APK (release)
        run: flutter build apk --release --no-tree-shake-icons

      - name: Rename APK with version
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk \
            dist/folio-${{ steps.ver.outputs.version }}-android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: folio-android-apk
          path: dist/folio-${{ steps.ver.outputs.version }}-android.apk
          if-no-files-found: error

  release:
    name: github release (tag only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-android]
    runs-on: ubuntu-latest
    steps:
      # 故意不 `actions/checkout` —— release job 只需要 artifacts + 上传, 不需要
      # git working tree。之前 checkout@v4 在 tag-only context 里偶发 token 注入
      # 失败 ("could not read Username for 'https://github.com'"), 直接绕开。
      - uses: actions/download-artifact@v4
        with:
          name: folio-android-apk
          path: dist/android

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/android/*.apk
