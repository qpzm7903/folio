# L20 鸿蒙构建专用 dependency_overrides。
#
# 用法: tool/ohos/build_hap.sh 会把本文件复制为仓库根的
# pubspec_overrides.yaml (已 gitignore), 构建完删除。
#
# 现状 (v0.17): 暂不集成 path_provider/shared_preferences/file_selector 的
# 鸿蒙联邦插件。原因: flutter_ohos 工具链在从 pub-cache 集成联邦插件时,
# hvigor 生成的 dependencyMap 模块路径有 bug (off-by-one + 模块解析),
# ohpm install 报 "module xxx_ohos does not exist", 详见
# docs/wiki/ohos/upstream-issues.md #1 (拟向 CPF-Flutter 提 issue/PR)。
#
# 降级策略: lib/core/bootstrap.dart 在鸿蒙上用内存版 shared_preferences,
# drift 自动回退 prefs 仓储 (path_provider 缺失被 try/catch 兜住),
# file_selector 由 PlatformCapabilities.supportsFileSelector 在鸿蒙上关闭。
# 应用可正常浏览金句/屏保/主题, 数据暂不跨重启持久化。
#
# 上游修复后, 恢复下方覆盖 (覆盖基础包以触发 ohos 背书) 并移除 bootstrap
# 的内存 prefs 守卫即可启用真持久化:
#
# dependency_overrides:
#   path_provider:        { git: { url: https://gitcode.com/openharmony-tpc/flutter_packages.git, path: packages/path_provider/path_provider } }
#   path_provider_ohos:   { git: { url: https://gitcode.com/openharmony-tpc/flutter_packages.git, path: packages/path_provider/path_provider_ohos } }
#   shared_preferences:   { git: { url: https://gitcode.com/openharmony-tpc/flutter_packages.git, path: packages/shared_preferences/shared_preferences } }
#   shared_preferences_ohos: { git: { url: https://gitcode.com/openharmony-tpc/flutter_packages.git, path: packages/shared_preferences/shared_preferences_ohos } }
#   file_selector:        { git: { url: https://gitcode.com/openharmony-tpc/flutter_packages.git, path: packages/file_selector/file_selector } }
#   file_selector_ohos:   { git: { url: https://gitcode.com/openharmony-tpc/flutter_packages.git, path: packages/file_selector/file_selector_ohos } }
